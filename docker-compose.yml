version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: faang-quant-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faang_quant_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faang_quant_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

